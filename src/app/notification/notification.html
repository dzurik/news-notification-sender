<h1>Hírekre feliratkozás</h1>

<form [formGroup]="notificationForm" (ngSubmit)="subscribeForEmail()" class="form">
  <input
    type="text"
    class="form-input"
    formControlName="emailAddress"
    name="email"
    placeholder="Írd be az email címed!"
    [class.form-input--error]="
      notificationForm.controls.emailAddress.touched &&
      notificationForm.controls.emailAddress.invalid
    "
  />

  <button type="submit" class="button-submit" [disabled]="notificationForm.invalid">
    Feliratkozás
  </button>
</form>
